<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biswajit ❤️ Nandita</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:radial-gradient(circle at center,#5b1648,#160018 75%);
    font-family:Georgia,serif;
    cursor:pointer;
}

/* TOP MESSAGE */
.title{
    position:absolute;
    top:6%;
    width:100%;
    text-align:center;
    color:white;
    z-index:10;
}

.title h1{
    font-size:clamp(30px,8vw,62px);
    text-shadow:0 0 12px #ff4d9d,0 0 35px #ff1493;
    animation:glow 2s infinite alternate;
}

.title p{
    margin-top:10px;
    color:#ffd5ea;
    font-size:18px;
}

@keyframes glow{
    from{filter:brightness(1)}
    to{filter:brightness(1.5)}
}

/* TREE */
.tree{
    position:absolute;
    width:430px;
    height:520px;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
}

/* TRUNK */
.trunk{
    position:absolute;
    bottom:0;
    left:48%;
    width:38px;
    height:330px;
    border-radius:25px;
    background:linear-gradient(90deg,#32140c,#814222,#32140c);
}

/* BRANCHES */
.branch{
    position:absolute;
    height:18px;
    background:#633119;
    border-radius:20px;
    transform-origin:left center;
}

.b1{
    width:190px;
    left:50%;
    top:190px;
    transform:rotate(-35deg);
}

.b2{
    width:180px;
    left:48%;
    top:240px;
    transform:rotate(38deg);
}

.b3{
    width:145px;
    left:48%;
    top:145px;
    transform:rotate(30deg);
}

.b4{
    width:135px;
    left:48%;
    top:130px;
    transform:rotate(-55deg);
}

/* TREE HEARTS */
.heart{
    position:absolute;
    width:23px;
    height:23px;
    background:#ff397f;
    transform:rotate(-45deg);
    animation:pulse 1.6s infinite;
    filter:drop-shadow(0 0 9px #ff1493);
}

.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:23px;
    height:23px;
    background:#ff397f;
    border-radius:50%;
}

.heart:before{
    top:-11px;
}

.heart:after{
    left:11px;
}

@keyframes pulse{
    50%{
        transform:rotate(-45deg) scale(1.3);
    }
}

.h1{left:40px;top:100px}
.h2{left:100px;top:60px}
.h3{left:160px;top:100px}
.h4{left:220px;top:50px}
.h5{left:280px;top:105px}
.h6{left:335px;top:80px}
.h7{left:75px;top:160px}
.h8{left:140px;top:145px}
.h9{left:210px;top:165px}
.h10{left:285px;top:150px}
.h11{left:115px;top:210px}
.h12{left:250px;top:220px}

/* CLICK MESSAGE */
.loveMessage{
    position:absolute;
    top:38%;
    width:100%;
    text-align:center;
    z-index:30;
    opacity:0;
    transform:scale(.3);
    transition:1s;
    pointer-events:none;
}

.loveMessage.show{
    opacity:1;
    transform:scale(1);
}

.loveMessage h2{
    color:white;
    font-size:clamp(32px,9vw,70px);
    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493,
        0 0 50px #ff69b4;
}

.loveMessage p{
    margin-top:12px;
    color:#ffd6eb;
    font-size:20px;
}

/* BIG GLOWING HEART */
.bigHeart{
    position:absolute;
    left:50%;
    top:50%;
    width:100px;
    height:100px;
    background:#ff1f75;
    transform:translate(-50%,-50%) rotate(-45deg) scale(0);
    z-index:25;
    opacity:0;
    transition:1s;
    filter:
        drop-shadow(0 0 15px #ff1493)
        drop-shadow(0 0 40px #ff1493);
}

.bigHeart:before,
.bigHeart:after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    background:#ff1f75;
    border-radius:50%;
}

.bigHeart:before{
    top:-50px;
}

.bigHeart:after{
    left:50px;
}

.bigHeart.show{
    opacity:.9;
    transform:translate(-50%,-50%) rotate(-45deg) scale(1);
    animation:bigPulse 1.2s infinite alternate;
}

@keyframes bigPulse{
    to{
        filter:
        drop-shadow(0 0 30px #ff1493)
        drop-shadow(0 0 80px #ff69b4);
    }
}

/* FALLING HEARTS */
.falling{
    position:fixed;
    top:-30px;
    z-index:40;
    animation:fall linear forwards;
    pointer-events:none;
    text-shadow:0 0 10px #ff1493;
}

@keyframes fall{
    0%{
        transform:translateY(-40px) rotate(0);
        opacity:0;
    }
    10%{opacity:1}
    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* BOTTOM */
.bottom{
    position:absolute;
    bottom:25px;
    width:100%;
    text-align:center;
    color:#ffd0e5;
    z-index:10;
    letter-spacing:2px;
    font-size:15px;
}

/* CLICK HINT */
.hint{
    position:absolute;
    bottom:55px;
    width:100%;
    text-align:center;
    color:#fff;
    z-index:10;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{opacity:.3}
}

@media(max-width:500px){
    .tree{
        transform:translateX(-50%) scale(.72);
        transform-origin:bottom center;
    }
}
</style>
</head>

<body>

<div class="title">
    <h1>Biswajit ❤️ Nandita</h1>
    <p>Two hearts, one beautiful story ✨</p>
</div>

<div class="tree">

    <div class="trunk"></div>

    <div class="branch b1"></div>
    <div class="branch b2"></div>
    <div class="branch b3"></div>
    <div class="branch b4"></div>

    <div class="heart h1"></div>
    <div class="heart h2"></div>
    <div class="heart h3"></div>
    <div class="heart h4"></div>
    <div class="heart h5"></div>
    <div class="heart h6"></div>
    <div class="heart h7"></div>
    <div class="heart h8"></div>
    <div class="heart h9"></div>
    <div class="heart h10"></div>
    <div class="heart h11"></div>
    <div class="heart h12"></div>

</div>

<!-- GLOWING HEART -->
<div class="bigHeart" id="bigHeart"></div>

<!-- LOVE MESSAGE -->
<div class="loveMessage" id="loveMessage">
    <h2>I Love You Nandita ❤️</h2>
    <p>Forever & Always 💕</p>
</div>

<div class="hint">
    ✨ Tap anywhere ✨
</div>

<div class="bottom">
    Biswajit 💕 Nandita — Forever Together
</div>

<script>

/* =========================
   FALLING HEARTS
========================= */

function createHeart(){

    const heart=document.createElement("div");

    heart.className="falling";
    heart.innerHTML=["❤️","💕","💖","💗","💓"][Math.floor(Math.random()*5)];

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(12+Math.random()*25)+"px";
    heart.style.animationDuration=(4+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(createHeart,350);


/* =========================
   ROMANTIC MUSIC
   Browser-generated melody
========================= */

let audioStarted=false;
let audioContext;

function playLoveMusic(){

    if(audioStarted) return;

    audioStarted=true;

    audioContext=new (window.AudioContext ||
        window.webkitAudioContext)();

    const notes=[
        261.63,329.63,392.00,
        329.63,293.66,349.23,
        392.00,440.00,
        392.00,329.63,261.63
    ];

    let time=audioContext.currentTime;

    notes.forEach((frequency,index)=>{

        const oscillator=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        oscillator.type="sine";
        oscillator.frequency.value=frequency;

        gain.gain.setValueAtTime(
            0,
            time
        );

        gain.gain.linearRampToValueAtTime(
            0.08,
            time+0.08
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            time+0.7
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(time);
        oscillator.stop(time+0.75);

        time+=0.55;

    });
}


/* =========================
   CLICK EFFECT
========================= */

document.body.addEventListener("click",function(){

    document
        .getElementById("loveMessage")
        .classList.add("show");

    document
        .getElementById("bigHeart")
        .classList.add("show");

    playLoveMusic();

    /* Extra heart explosion */

    for(let i=0;i<35;i++){

        setTimeout(()=>{

            const heart=
                document.createElement("div");

            heart.className="falling";
            heart.innerHTML="❤️";

            heart.style.left=
                (45+Math.random()*10)+"vw";

            heart.style.top=
                (40+Math.random()*15)+"vh";

            heart.style.fontSize=
                (15+Math.random()*25)+"px";

            heart.style.animationDuration=
                (2+Math.random()*2)+"s";

            document.body.appendChild(heart);

            setTimeout(()=>{
                heart.remove();
            },5000);

        },i*40);
    }

});

</script>

</body>
</html>
